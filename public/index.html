<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Ab Ai</title>
  <meta name="description" content="Ab Ai">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ab Ai">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="splash" class="screen splash"><img src="/icons/icon-192.png" alt=""></div>

  <section id="login" class="screen login hidden">
    <div class="login-box">
      <img class="login-logo" src="/icons/icon-192.png" alt="">
      <h1>Ab Ai</h1>
      <p>اكتب الرمز مالتك حتى تدخل</p>
      <form id="loginForm" autocomplete="off">
        <input id="code" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="الرمز" required>
        <button type="submit" class="btn-primary">دخول</button>
      </form>
      <div id="loginErr" class="err"></div>
    </div>
  </section>

  <section id="chat" class="screen chat hidden">
    <header class="topbar">
      <div class="avatar group-avatar">م</div>
      <div class="title">
        <div class="name">محادثة 1</div>
        <div id="status" class="status"></div>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <div id="banner" class="banner hidden"></div>
    <main id="list" class="list"><div id="msgs" class="msgs"></div></main>
    <button id="toBottom" class="to-bottom hidden" aria-label="للأسفل">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <footer class="composer">
      <div id="recBar" class="rec-bar hidden">
        <button id="recCancel" class="icon-btn danger" aria-label="إلغاء">
          <svg viewBox="0 0 24 24"><path d="M6 7h12M9 7V5h6v2m-8 0l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="rec-dot"></span><span id="recTime">0:00</span>
        <span class="rec-hint">جاري التسجيل…</span>
      </div>
      <div id="inputRow" class="input-row">
        <button id="attachBtn" class="icon-btn" aria-label="إرفاق">
          <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="field">
          <textarea id="text" rows="1" placeholder="رسالة" autocomplete="off" spellcheck="false"></textarea>
          <button id="stickerBtn" class="icon-btn small" aria-label="ملصقات">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/><path d="M8 14.5c1 1.4 2.4 2 4 2s3-.6 4-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <button id="actionBtn" class="send-btn mic" aria-label="إرسال">
        <svg class="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-send" viewBox="0 0 24 24"><path d="M20 12L4 4l2.5 8L4 20z" transform="scale(-1,1) translate(-24,0)"/></svg>
      </button>
      <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
    </footer>

    <div id="stickerPanel" class="sticker-panel hidden">
      <div id="packTabs" class="pack-tabs"></div>
      <div id="packGrid" class="pack-grid"></div>
    </div>
  </section>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet-bg"></div><div class="sheet"></div></div>
  <div id="viewer" class="viewer hidden"><div class="viewer-img"></div><button class="viewer-close" aria-label="إغلاق">✕</button></div>
  <div id="toast" class="toast hidden"></div>
  <div id="shield" class="shield hidden"><img src="/icons/icon-192.png" alt=""></div>

  <script src="/app.js" defer></script>
</body>
</html>
